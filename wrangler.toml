#:schema node_modules/wrangler/config-schema.json
name = "aizodiac-web"
compatibility_date = "2026-09-11"
compatibility_flags = ["nodejs_compat"]

# Static Assets directory for Cloudflare Workers deployment
[assets]
directory = "./dist/client"
binding = "ASSETS"

# Native Cloudflare R2 Bucket Binding (AI Zodiac account)
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "aizodiac-assets"

# Native Cloudflare Workers AI Binding (AI Zodiac account)
[ai]
binding = "AI"

# Non-sensitive runtime environment variables / default configuration
[vars]
SITE_URL = "https://aizodiac.life"
GROQ_MODEL = "openai/gpt-oss-120b"
R2_BUCKET_NAME = "aizodiac-assets"
R2_PUBLIC_BASE_URL = "https://assets.aizodiac.workers.dev"
WORKERS_AI_IMAGE_MODEL = "@cf/black-forest-labs/flux-1-schnell"
AI_DAILY_TEXT_LIMIT = "50"
AI_MONTHLY_TEXT_LIMIT = "1000"
AI_DAILY_IMAGE_LIMIT = "20"
AI_MONTHLY_IMAGE_LIMIT = "400"
AI_MAX_ARTICLE_LENGTH_TOKENS = "3500"
